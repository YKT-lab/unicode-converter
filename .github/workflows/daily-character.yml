name: Daily Unicode Character

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Validate daily explanation code
        run: |
          node --check scripts/source-registry.js
          node --check scripts/daily-evidence.js
          node --check scripts/generate-daily.js
          node --check scripts/generate-described-daily.js
          node --check js/daily.js
          node scripts/test-daily-evidence.js

      - name: Generate daily characters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing; refusing to publish undocumented characters."
            exit 1
          fi
          node scripts/generate-described-daily.js

      - name: Commit daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json

          if git diff --cached --quiet; then
            echo "daily.json is already up to date"
          else
            git commit -m "Update daily Unicode character"
            git push
          fi

