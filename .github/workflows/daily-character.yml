name: Daily Unicode Character

on:
  workflow_dispatch:
  # Deploy source changes immediately, but not bot-generated daily.json commits.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "js/daily.js"
      - "js/svg-mode.js"
      - "index.html"
      - "style.css"
      - ".github/workflows/daily-character.yml"
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Validate daily explanation code
        run: |
          node --check scripts/source-registry.js
          node --check scripts/daily-evidence.js
          node --check scripts/generate-daily.js
          node --check scripts/generate-described-daily.js
          node --check js/daily.js
          node scripts/test-daily-evidence.js

      - name: Generate daily characters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing; refusing to publish undocumented characters."
            exit 1
          fi
          node scripts/generate-described-daily.js

      - name: Commit daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json

          if git diff --cached --quiet; then
            echo "daily.json is already up to date"
          else
            git commit -m "Update daily Unicode character"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare SVG compatibility fonts
        run: |
          node --check js/svg-mode.js
          node scripts/test-svg-mode.js
          node --check js/converter.js
          cp node_modules/opentype.js/dist/opentype.min.js js/opentype.min.js
          python3 -m venv /tmp/svg-venv
          /tmp/svg-venv/bin/pip install --quiet 'fonttools[woff]'
          /tmp/svg-venv/bin/python scripts/prepare-svg-fonts.py .

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
