name: Audit SVG Font License Metadata
on:
  push:
    branches: [feature/svg-license-family-expansion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node scripts/audit-svg-font-licenses.js
