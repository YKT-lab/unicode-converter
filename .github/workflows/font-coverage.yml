name: Unicode 18 Font Coverage Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/font-coverage.yml"
      - "scripts/audit-unicode18-fonts.js"
      - "scripts/build-unicode18-font-index.js"
      - "scripts/test-unicode18-font-index.js"
      - "scripts/test-font-assignment.js"
      - "scripts/test-mobile-font-outlines.js"
      - "scripts/test-unicode18-emoji-display.js"
      - "data/unicode18_emoji_presentation.json"
      - "js/emoji-display.js"
      - "js/daily.js"
      - "scripts/generate-daily.js"
      - "data/unicode18_all_ranges.json"
      - "data/unicode18_font_candidates_175.json"
      - "data/unicode18_font_audit_manifest.json"
      - "fonts/**"
      - "js/font-coverage.js"
      - "js/converter.js"
      - "js/main.js"
      - "js/bulk-input-policy.js"
      - "scripts/test-bulk-input-policy.js"
      - "js/fonts.js"
      - "js/glyph-check.js"
      - "index.html"
      - "style.css"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install font parsing dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Check Javascript syntax
        run: |
          node --check scripts/audit-unicode18-fonts.js
          node --check scripts/build-unicode18-font-index.js
          node --check scripts/test-unicode18-font-index.js
          node --check scripts/test-font-assignment.js
          node --check scripts/test-mobile-font-outlines.js
          node --check js/font-coverage.js
          node --check js/emoji-display.js
          node --check js/daily.js
          node --check scripts/test-unicode18-emoji-display.js
          node --check js/converter.js
          node --check js/main.js
          node --check js/bulk-input-policy.js
          node --check scripts/test-bulk-input-policy.js
          node --check js/fonts.js
          node --check scripts/generate-daily.js
      - name: Inspect real on-site font cmap tables
        run: node scripts/audit-unicode18-fonts.js
      - name: Build compressed browser font-coverage lookup
        run: node scripts/build-unicode18-font-index.js
      - name: Validate font index and official Unicode boundaries
        run: node scripts/test-unicode18-font-index.js
      - name: Verify new font assignments for reported Unicode characters
        run: node scripts/test-font-assignment.js
      - name: Verify specialist outlines for eight mobile problem characters
        run: node scripts/test-mobile-font-outlines.js
      - name: Test bulk Unicode input performance policy
        run: node scripts/test-bulk-input-policy.js
      - name: Test Unicode 18 color emoji classification
        run: node scripts/test-unicode18-emoji-display.js
      - name: Check daily character font discovery
        run: |
          node - <<'NODE'
          const {loadFonts}=require('./scripts/generate-daily.js');
          const fonts=loadFonts();
          const paths=new Set(fonts.map(f=>f.file));
          if(fonts.length<25)throw Error('New fonts not discovered in daily generator');
          for(const required of [
            'fonts/han/PlangothicP1-Regular.woff2',
            'fonts/seal/KaiyuanSmallSeal-Regular.woff2',
            'fonts/scripts/NotoSansArabic-Regular.ttf',
            'fonts/ancient/NotoSansCuneiform-Regular.ttf'
          ])if(!paths.has(required))throw Error('Missing daily font: '+required);
          console.log('Daily SVG font discovery passed:',fonts.length,'fonts');
          NODE
      - name: Persist reproducible coverage data
        run: |
          # Save the current run's deterministic outputs, then rebase on the
          # latest remote commit BEFORE staging them, avoiding JSON conflicts.
          mkdir -p /tmp/unicode-font-output
          cp data/unicode18_font_cmap_audit.json /tmp/unicode-font-output/
          cp data/unicode18_font_coverage_index.json /tmp/unicode-font-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Generated files were already backed up in /tmp; clear working-tree
          # changes before switching to a newer main commit.
          git reset --hard HEAD
          git checkout --detach origin/main
          cp /tmp/unicode-font-output/* data/
          git add data/unicode18_font_cmap_audit.json data/unicode18_font_coverage_index.json
          if git diff --cached --quiet; then
            echo "Coverage output already current"
          else
            git commit -m "Regenerate verified Unicode 18.0 cmap coverage index"
            git push origin HEAD:main
          fi
      - name: Assemble GitHub Pages artifact without node_modules
        run: |
          mkdir -p _font_coverage_site
          cp index.html style.css logo.png daily.json _font_coverage_site/
          cp -R js fonts data _font_coverage_site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_font_coverage_site"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
