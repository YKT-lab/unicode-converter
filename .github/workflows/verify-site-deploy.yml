name: Validate Unified Pages Deployment

on:
  push:
    branches: [feature/unified-pages-deployment]
    paths:
      - ".github/workflows/**"
      - "scripts/test-pages-unification.js"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/test-pages-unification.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-without-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Check one-deployer invariant
        run: node scripts/test-pages-unification.js
      - name: Check SVG and existing converter tests
        run: |
          node scripts/test-svg-mode.js
          node scripts/test-svg-mode-ui.js
          node scripts/test-svg-scope.js
          node scripts/test-svg-precomputed-loader.js
          node scripts/test-svg-publish-guard.js
      - name: Rebuild the real font index
        run: |
          node scripts/audit-unicode18-fonts.js
          node scripts/build-unicode18-font-index.js
          node scripts/test-unicode18-font-index.js
      - name: Package the actual site without deploying it
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='_site' --exclude='svg-data' ./ _site/
          cp node_modules/opentype.js/dist/opentype.min.js _site/js/opentype.min.js
          python3 -m venv "$RUNNER_TEMP/svg-font-converter"
          "$RUNNER_TEMP/svg-font-converter/bin/pip" install --quiet 'fonttools[woff]'
          "$RUNNER_TEMP/svg-font-converter/bin/python" scripts/prepare-svg-fonts.py _site
          test -s _site/js/opentype.min.js
          test -s _site/js/svg-precomputed-loader.js
          test -s _site/data/unicode18_font_coverage_index.json
          test ! -e _site/svg-data/active.json
          echo "Site bytes:"
          du -sh _site
          echo "Dry-run packaging passed. No Pages deployment performed."
