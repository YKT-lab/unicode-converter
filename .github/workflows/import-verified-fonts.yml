name: Import Pinned Verified Font Sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-verified-fonts.yml"
      - "scripts/import-verified-fonts.js"
      - "data/verified_font_imports.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: verified-font-import
  cancel-in-progress: false

jobs:
  import-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install font tooling
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify download and glyph outlines
        run: node scripts/import-verified-fonts.js
      - name: Commit vetted fonts and trigger index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/
          if git diff --cached --quiet; then
            echo "Registered font files are already installed"
          else
            git commit -m "Install verified Extension J font and license"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            # Pushes made with GITHUB_TOKEN do not start push workflows.
            gh workflow run font-coverage.yml --ref main
          fi
